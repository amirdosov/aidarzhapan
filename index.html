     интернета. Личный адрес запуска подставляет app.js: в файле
     его быть не может — он у каждого свой. -->

<!-- ═══════════ «не открылось» ═══════════
     Весь текст на сайте ставит скрипт, поэтому любая его ошибка
     оставляла человека перед пустым экраном: шапка есть, а больше
     ничего. Ловим такое до всех остальных скриптов и говорим
     на обоих языках, без единой строки из данных. -->
<div class="boom" id="boom" hidden>
  <div class="boom-in">
    <p class="boom-line">Шежіре ашылмады. Бетті жаңартып көріңіз.</p>
    <p class="boom-line ru">Шежіре не открылось. Обновите страницу.</p>
    <button class="boom-btn" id="boomAgain" type="button">Жаңарту · Обновить</button>
    <p class="boom-why" id="boomWhy"></p>
  </div>
</div>
<script>
(function () {
  function show(why) {
    var b = document.getElementById('boom');
    if (!b || !b.hidden) return;
    b.hidden = false;
    var w = document.getElementById('boomWhy');
    if (w && why) w.textContent = why;
  }
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      show('жүктелмеді: ' + String(t.src || t.href).split('/').pop());
      return;
    }
    show((e && e.message ? e.message : 'қате') +
         (e && e.filename ? ' · ' + String(e.filename).split('/').pop() : ''));
  }, true);
  document.addEventListener('DOMContentLoaded', function () {
    var again = document.getElementById('boomAgain');
    if (again) again.addEventListener('click', function () { location.reload(); });
  });
})();
</script>

<!-- ═══ работник ═══
     Держит шежіре в телефоне: открывается без сети и без браузера.
     Регистрируем в стороне от всего: не вышло — сайт работает
     как работал. -->
<script>
(function () {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
  /* Пришла новая версия шежіре — страницу перечитываем один раз.
     Один: иначе перезагрузка вызывает перезагрузку. А в самый
     первый раз не перечитываем вовсе: там работник не сменился,
     а только появился, и страница уже свежая. */
  var first = !navigator.serviceWorker.controller;
  var again = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (first || again) return;
    again = true;
    location.reload();
  });
})();
</script>
