<!doctype html>
<html lang="kk" data-theme="dark" data-lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1418">
<meta name="robots" content="noindex, nofollow">
<title>АйдарЖапан шежіресі</title>
<meta property="og:title" content="АйдарЖапан шежіресі">
<meta property="og:description" content="139 адам, 20 ұрпақ · Кім кімге кім болады">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css?v=10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#top">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 29V13M16 13l-7-6M16 13l7-6M16 13V4"/>
        <circle cx="16" cy="3" r="2.2"/><circle cx="8" cy="6.5" r="2.2"/><circle cx="24" cy="6.5" r="2.2"/>
      </svg>
      <span data-i18n="brand"></span>
    </a>
    <div class="bar-tools">
      <button class="me-btn" id="meBtn"><span id="meLabel"></span></button>
      <div class="seg" role="group" aria-label="Language">
        <button class="seg-btn is-on" data-lang-set="kk">ҚАЗ</button>
        <button class="seg-btn" data-lang-set="ru">РУС</button>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Theme">
        <svg viewBox="0 0 24 24" class="ico-moon" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
        <svg viewBox="0 0 24 24" class="ico-sun" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M19.1 4.9l-1.9 1.9M6.8 17.2l-1.9 1.9"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="top">

  <!-- ═══════════ ТІЗБЕК ═══════════ -->
  <section class="view" id="view-tape">
    <div class="hero">
      <div class="hero-glow" aria-hidden="true"></div>
      <div class="hero-in">
        <p class="kicker reveal" data-i18n="kicker"></p>
        <h1 class="title reveal" data-i18n="title"></h1>
        <p class="surname reveal" data-i18n="surname"></p>
        <p class="lede reveal" data-i18n="lede"></p>

        <svg class="orn reveal" viewBox="0 0 240 46" aria-hidden="true">
          <path class="draw" d="M8 23h74"/>
          <path class="draw" d="M232 23h-74"/>
          <path class="draw" d="M120 8c-11 0-18 7-18 15s7 15 18 15 18-7 18-15-7-15-18-15Z"/>
          <path class="draw" d="M120 15c-5 0-8 3.6-8 8s3 8 8 8 8-3.6 8-8-3-8-8-8Z"/>
        </svg>

        <button class="cta" id="heroPick" data-i18n="pickCta"></button>
        <p class="hint" id="heroHint"></p>
      </div>
    </div>

    <div class="rail" id="rail">
      <div class="rail-in">
        <p class="rail-main" id="railMain"></p>
        <p class="rail-now" id="railNow"></p>
      </div>
      <div class="rail-progress" id="railProgress" aria-hidden="true"></div>
    </div>

    <div class="tape" id="tape"></div>
  </section>

  <!-- ═══════════ ТУЫСТАР ═══════════ -->
  <section class="view" id="view-kin" hidden>
    <div class="view-head">
      <p class="eyebrow" data-i18n="kinEyebrow"></p>
      <h2 data-i18n="kinTitle"></h2>
      <p class="muted" data-i18n="kinLede"></p>
      <p class="kin-hint" id="kinHint"></p>
    </div>
    <div class="list" id="kinList"></div>
  </section>

  <!-- ═══════════ АҒАШ ═══════════ -->
  <section class="view" id="view-tree" hidden>
    <div class="view-head">
      <p class="eyebrow" data-i18n="treeEyebrow"></p>
      <h2 id="treeTitle"></h2>
      <p class="muted" id="treeLede"></p>
      <div class="seg tree-seg" role="group">
        <button class="seg-btn is-on" data-tree-mode="tree"></button>
        <button class="seg-btn" data-tree-mode="list"></button>
        <button class="seg-btn" data-tree-mode="gen"></button>
      </div>
    </div>

    <div class="crumbs" id="crumbs"></div>

    <div class="stage" id="stage" data-mode="list">
      <div class="stage-tools">
        <div class="zoom-tools">
          <button class="icon-btn sm" data-zoom="-1" aria-label="Zoom out">
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
          </button>
          <button class="icon-btn sm wide" data-zoom="0" id="zoomLabel">100%</button>
          <button class="icon-btn sm" data-zoom="1" aria-label="Zoom in">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <button class="icon-btn sm list-tools" id="foldBtn" aria-label="Fold">
          <svg viewBox="0 0 24 24"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
        </button>
      </div>

      <div class="viewport" id="viewport">
        <div class="canvas" id="canvas">
          <div class="zoomer" id="zoomer">
            <svg class="links" id="links"></svg>
            <div class="tree" id="treeRoot"></div>
          </div>
        </div>
      </div>

      <div class="outline" id="outline"></div>
    </div>

    <div class="list" id="treeList"></div>
  </section>

  <!-- ═══════════ ІЗДЕУ ═══════════ -->
  <section class="view" id="view-search" hidden>
    <div class="view-head">
      <p class="eyebrow" data-i18n="searchEyebrow"></p>
      <h2 data-i18n="searchTitle"></h2>
    </div>
    <div class="search-box">
      <input type="search" id="searchInput" autocomplete="off" spellcheck="false">
    </div>
    <div class="list" id="searchList"></div>
  </section>

  <footer class="foot">
    <svg class="orn small" viewBox="0 0 240 46" aria-hidden="true">
      <path class="draw" d="M8 23h74"/><path class="draw" d="M232 23h-74"/>
      <path class="draw" d="M120 12c-8 0-13 5-13 11s5 11 13 11 13-5 13-11-5-11-13-11Z"/>
    </svg>
    <button class="foot-link" id="gapsLink"></button>
    <p class="muted" data-i18n="footAuthor"></p>
    <p class="muted small" data-i18n="footNote"></p>
  </footer>

</main>

<!-- ═══════════ нижняя панель ═══════════ -->
<nav class="nav" id="nav">
  <button class="nav-btn is-on" data-view="tape"><span data-i18n="navTape"></span></button>
  <button class="nav-btn" data-view="kin"><span data-i18n="navKin"></span></button>
  <button class="nav-btn" data-view="tree"><span data-i18n="navTree"></span></button>
  <button class="nav-btn" data-view="search"><span data-i18n="navSearch"></span></button>
  <button class="nav-close" id="navClose" hidden data-i18n="close"></button>
</nav>

<!-- ═══════════ карточка человека ═══════════ -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-body" id="sheetBody" role="dialog" aria-modal="true"></div>
</div>

<!-- ═══════════ «Сіз кімсіз?» ═══════════ -->
<div class="sheet picker" id="picker" hidden>
  <div class="sheet-scrim" data-close></div>
  <div class="sheet-body">
    <div class="picker-head">
      <h2 data-i18n="pickTitle"></h2>
      <p class="muted small" data-i18n="pickNote"></p>
      <div class="search-box">
        <input type="search" id="pickInput" autocomplete="off" spellcheck="false">
      </div>
      <button class="pick-skip" id="pickSkip" data-close></button>
    </div>
    <div class="list" id="pickList"></div>
  </div>
</div>

<!-- всплывающая подсказка: «ссылка скопирована» -->
<div class="toast" id="toast" hidden></div>

<script src="data/people.js?v=4"></script>
<script src="data/stories.js?v=2"></script>
<script src="assets/photos.js?v=2"></script>
<script src="assets/kinship.js?v=2"></script>
<script src="assets/app.js?v=11"></script>
</body>
</html>
